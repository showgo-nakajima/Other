<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Document</title>
 <!-- ==================================================================== -->
 <!-- EXTERNAL LIBRARIES & FONTS                                           -->
 <!-- ==================================================================== -->
 <!-- Tailwind CSS -->
 <script src="https://cdn.tailwindcss.com"></script>
 <!-- Google Fonts: Plus Jakarta Sans -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
 <!-- Font Awesomen Icons -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <!-- CSSファイルを読み込む -->
 <link rel="stylesheet" href="style.css">
 <!-- ==================================================================== -->
 <!-- SCRIPT                                                               -->
 <!-- ==================================================================== -->
 <script>
  tailwind.config = {
   theme: {
    extend: {
     fontFamily: {
      sans: ['"Plus Jakarta Sans"', 'sans-serif'],
     }
    }
   }
  }
 </script>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-blue-100 selection:text-blue-900">
 <!-- ==================================================================== -->
 <!-- HTML STRUCTURE SECTION(HTMLスケルトン)                                -->
 <!-- ==================================================================== -->

 <!-- Main Content Wrapper -->
 <main class="max-w-4xl mx-auto px-6 py-16 md:py-24 z-10 w-full flex-grow">

  <!-- Header & Hero Section -->
  <header class="mb-16 md:mb-24">
   <div class="flex items-center justify-between mb-8">
    <!-- Brand Signature -->
    <div class="flex items-center gap-2">
     <span class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></span>
     <span class="text-xs font-bold tracking-[0.2em] uppercase text-slate-500">Available</span>
    </div>
    <!-- Social links -->
     <div class="flex gap-4 text-slate-400 hover:text-slate-600 text-sm">
      <a href="#" class="hover:text-blue-600 transition-colors" title="Github"><i class="fa-brands fa-github"></i></a>
      <a href="#" class="hover:text-blue-600 transition-colors" title="######"><i class="fa-brands fa-#####"></i></a>
      <a href="#" class="hover:text-blue-600 transition-colors" title="Email"><i class="fa-solid fa-envelope"></i></a>
     </div>
   </div>

   <!-- Main Intro Hook -->
   <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight leading-[1.15] mb-4 text-slate-900">
    Mimoza,Davin
   </h1>
   <p class="text-sm font-bold tracking-[0.2em] text-red-600 uppercase mb-6">
    Visual Designer
   </p>
   <p class="text-slate-500 leading-relaxed max-w-xl text-sm md:text-base">
    I am a visual designer who beautifully translates brand values into visual form. I specialize in creating sophisticated UI/UX designs and artwork using Figma.
   </p>
  </header>

  <!-- Selected Works (3 Items maximum) -->
  <section class="mb-16 md:mb-24">
    <h2 class="text-xs font-bold tracking-[0.2em] uppercase text-slate-400 mb-8 flex items-center gap-2">
      <span>Selected Works</span>
      <span class="h-[1px] bg-slate-200 flex-grow"></span>
    </h2>
  </section>
 </main>
 </body>
</html>
